name: PR 29308 filesystem-admission red proof

on:
  push:
    branches:
      - fix/pr-29308-filesystem-synthetic-admission

concurrency:
  group: pr-29308-filesystem-admission-red
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  red-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pr-29308-filesystem-synthetic-admission
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Prove the new full-resolver regression is red before production repair
        shell: bash
        run: |
          set +e
          bun test packages/agent/src/runtime/synthetic-filesystem-admission.test.ts 2>&1 | tee "$RUNNER_TEMP/red-proof.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Regression unexpectedly passed before the production admission repair."
            exit 1
          fi
          grep -q "denies an undeclared plugin" "$RUNNER_TEMP/red-proof.log"
          echo "Expected red proof observed: filesystem-discovered plugins were not denied by the current resolver."
