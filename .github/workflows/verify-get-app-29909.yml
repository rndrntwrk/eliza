# Fork-only validation for issue #29909. This workflow is not part of the
# upstream feature branch and has no deployment or provider credentials.
name: Verify GET_APP 29909

on:
  push:
    branches: [chore/verify-get-app-29909]
    paths: [.github/workflows/verify-get-app-29909.yml]

permissions:
  contents: read

concurrency:
  group: verify-get-app-29909
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'rndrntwrk/eliza'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      CANDIDATE_SHA: 1eb36f63e8ef946a0d37950bdb133d6a89bc867a
      BASE_SHA: 1045297ccaffff37519a6a4b2a0203c273443a84
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1eb36f63e8ef946a0d37950bdb133d6a89bc867a
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/get-app-evidence"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          {
            git rev-parse HEAD HEAD^{tree}
            git diff --stat "$BASE_SHA" "$CANDIDATE_SHA"
            git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          } | tee "$RUNNER_TEMP/get-app-evidence/source.txt"

      - name: Install pinned workspace dependencies
        id: setup
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: '1.3.14'
          node-version: '24.15.0'
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: 'false'
          install-protoc: 'false'
          setup-python: 'false'
          run-postinstall: 'false'
          setup-fused-inference: 'false'
          cache-bun-install: 'false'
          skip-avatar-clone: 'true'
          no-vision-deps: 'true'

      - name: Build package prerequisites
        id: prerequisites
        shell: bash
        run: |
          set -euo pipefail
          {
            node --version
            bun --version
            bun run build:core
            bun run --cwd packages/cloud/sdk build
          } 2>&1 | tee "$RUNNER_TEMP/get-app-evidence/prerequisites.txt"

      - name: Run real GET_APP suite
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          bun test plugins/plugin-cloud-apps/__tests__/get-app.test.ts \
            2>&1 | tee "$RUNNER_TEMP/get-app-evidence/focused.txt"

      - name: Run complete owning package suite
        if: '!cancelled() && steps.prerequisites.outcome == ''success'''
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd plugins/plugin-cloud-apps test \
            2>&1 | tee "$RUNNER_TEMP/get-app-evidence/package-tests.txt"

      - name: Typecheck owning package
        if: '!cancelled() && steps.prerequisites.outcome == ''success'''
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd plugins/plugin-cloud-apps typecheck \
            2>&1 | tee "$RUNNER_TEMP/get-app-evidence/typecheck.txt"

      - name: Lint owning package
        if: '!cancelled() && steps.setup.outcome == ''success'''
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd plugins/plugin-cloud-apps lint:check \
            2>&1 | tee "$RUNNER_TEMP/get-app-evidence/lint.txt"

      - name: Build owning package
        if: '!cancelled() && steps.prerequisites.outcome == ''success'''
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd plugins/plugin-cloud-apps build \
            2>&1 | tee "$RUNNER_TEMP/get-app-evidence/build.txt"

      - name: Run repository verification
        if: '!cancelled() && steps.prerequisites.outcome == ''success'''
        shell: bash
        run: |
          set -euo pipefail
          bun run verify 2>&1 | tee "$RUNNER_TEMP/get-app-evidence/verify.txt"

      - name: Retain exact-head logs on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: get-app-29909-1eb36f63
          path: ${{ runner.temp }}/get-app-evidence
          if-no-files-found: error
          retention-days: 7
