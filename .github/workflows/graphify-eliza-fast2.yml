name: Eliza path-census essential Graphify evidence (ephemeral)

on:
  pull_request:
    branches:
      - graphify/base-8d60e536-20260820

permissions:
  contents: read

concurrency:
  group: graphify-eliza-fast2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  graphify:
    name: graphify
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      SOURCE_SHA: 8d60e5366c2d388bd1cd57d8b3169a2db3aa7fcf
      SOURCE_TREE: 3c7bb3d191be1a6d4f45e9e53f6e0e1725bd3c30
      GRAPHIFY_VERSION: 0.9.46
      GRAPHIFY_WHEEL_SHA256: 35d854d66884c623a8e25ca059b54744ade91ae17ffc0f79fd39e108a1666b5d
      GRAPHIFY_QUERY_LOG_DISABLE: '1'
      GRAPHIFY_MAX_WORKERS: '1'
      GRAPHIFY_MAX_NODES: '250000'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      NO_COLOR: '1'
      CI: 'true'
      TZ: UTC

    steps:
      - name: Checkout exact frozen essential framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /package.json
            /bun.lock
            /turbo.json
            /tsconfig.json
            /tsconfig.base.json
            /biome.json
            /biome.jsonc
            /lerna.json
            /packages/core/**
            /packages/agent/**
            /packages/contracts/**
            /packages/shared/**
            /packages/prompts/**
            /packages/skills/**
            /packages/scenario-runner/**
            /packages/vault/**
            /packages/elizaos/**
            /packages/app-core/package.json
            /packages/app-core/src/**
            /packages/app-core/scripts/**
            /packages/app-core/test/**
            /packages/app-core/tests/**
            /packages/app-core/tsconfig*.json

      - name: Freeze source and build path-only complete census
        id: census
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/eliza-evidence"
          mkdir -p "$evidence/logs" "$evidence/native" "$evidence/queries" "$evidence/qualification"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "source_commit_date=$(git show -s --format=%cI HEAD)"
            echo "workflow_event_sha=$GITHUB_SHA"
            echo "workflow_ref=$GITHUB_REF"
          } | tee "$evidence/logs/source-freeze.log"
          git status --short --branch | tee "$evidence/logs/initial-git-status.log"

          # Deliberately omit `-l`: asking Git for every blob size defeats a
          # blobless sparse checkout on this multi-gigabyte fork.
          git ls-tree -r -z "$SOURCE_SHA" > "$evidence/tree.z"
          export EVIDENCE_DIR="$evidence"
          python3 - <<'PY'
          import csv, hashlib, json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_DIR'])
          raw = (root / 'tree.z').read_bytes()
          selected_prefixes = (
              'packages/core/', 'packages/agent/', 'packages/contracts/',
              'packages/shared/', 'packages/prompts/', 'packages/skills/',
              'packages/scenario-runner/', 'packages/vault/',
              'packages/elizaos/', 'packages/app-core/src/',
              'packages/app-core/scripts/', 'packages/app-core/test/',
              'packages/app-core/tests/',
          )
          selected_exact = {
              'README.md', 'package.json', 'bun.lock', 'turbo.json',
              'tsconfig.json', 'tsconfig.base.json', 'biome.json',
              'biome.jsonc', 'lerna.json', 'packages/app-core/package.json',
          }

          def partition(path: str) -> str:
              if path in selected_exact or path.startswith(selected_prefixes):
                  return 'essential-framework'
              if path.startswith('plugins/'):
                  return 'integration-plugins-tail'
              if path.startswith('packages/examples/'):
                  return 'examples-tail'
              if path.startswith('packages/benchmarks/'):
                  return 'benchmarks-tail'
              if path.startswith(('packages/cloud-', 'packages/cloud/', 'cloud/')):
                  return 'cloud-separate-priority'
              if path.startswith(('packages/training/', 'training/')):
                  return 'training-research'
              if path.startswith(('packages/app/', 'packages/ui/')):
                  return 'app-and-ui'
              if path.startswith(('packages/mobile', 'packages/android', 'packages/ios', 'apps/')):
                  return 'mobile-and-apps'
              if path.startswith(('docs/', '.github/')):
                  return 'docs-and-automation'
              if path.startswith('packages/'):
                  return 'other-framework-packages'
              if Path(path).suffix.lower() in {
                  '.png', '.jpg', '.jpeg', '.gif', '.webp', '.mp4', '.mov',
                  '.wav', '.mp3', '.onnx', '.gguf', '.bin', '.zip', '.tar',
                  '.gz', '.pdf',
              }:
                  return 'media-and-binaries'
              return 'repository-root-and-other'

          materialized = {}
          for walk_root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              base = Path(walk_root)
              for name in files:
                  path = (base / name).relative_to(Path('.')).as_posix()
                  p = Path(path)
                  try:
                      data = p.read_bytes()
                      materialized[path] = {
                          'bytes': len(data),
                          'sha256': hashlib.sha256(data).hexdigest(),
                      }
                  except OSError:
                      materialized[path] = {'bytes': None, 'sha256': ''}

          rows = []
          parts = defaultdict(lambda: {'files': 0, 'materialized_files': 0, 'known_bytes': 0})
          extensions = Counter()
          for rec in raw.split(b'\0'):
              if not rec:
                  continue
              text = rec.decode('utf-8', 'replace')
              meta, path = text.split('\t', 1)
              mode, obj, sha = meta.split()[:3]
              part = partition(path)
              selected = part == 'essential-framework'
              local = materialized.get(path)
              known_bytes = local['bytes'] if local else None
              row = {
                  'path': path,
                  'mode': mode,
                  'object_type': obj,
                  'git_blob_sha': sha,
                  'known_bytes': '' if known_bytes is None else known_bytes,
                  'sha256_if_materialized': '' if not local else local['sha256'],
                  'extension': Path(path).suffix.lower() or '[none]',
                  'partition': part,
                  'selected_for_native': 'yes' if selected else 'no',
                  'materialized': 'yes' if local else 'no',
                  'accounting_note': (
                      'Native essential-framework extraction.' if selected else
                      'Complete path census; bounded deferred partition; blob bytes intentionally not fetched.'
                  ),
              }
              rows.append(row)
              parts[part]['files'] += 1
              if local:
                  parts[part]['materialized_files'] += 1
                  parts[part]['known_bytes'] += known_bytes or 0
              extensions[row['extension']] += 1

          fields = list(rows[0])
          with (root / 'SOURCE_COVERAGE.csv').open('w', newline='', encoding='utf-8') as stream:
              writer = csv.DictWriter(stream, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          with (root / 'PARTITION_REGISTER.csv').open('w', newline='', encoding='utf-8') as stream:
              fields = ['partition', 'files', 'materialized_files', 'known_bytes', 'disposition']
              writer = csv.DictWriter(stream, fieldnames=fields)
              writer.writeheader()
              for name, stats in sorted(parts.items()):
                  writer.writerow({
                      'partition': name,
                      **stats,
                      'disposition': 'native Graphify' if name == 'essential-framework' else 'bounded deferred partition',
                  })

          summary = {
              'tracked_paths': len(rows),
              'tracked_total_bytes': 'UNKNOWN_BY_DESIGN_BLOBLESS_PATH_CENSUS',
              'materialized_files': len(materialized),
              'materialized_known_bytes': sum((v['bytes'] or 0) for v in materialized.values()),
              'selected_native_paths': sum(r['selected_for_native'] == 'yes' for r in rows),
              'selected_native_materialized': sum(
                  r['selected_for_native'] == 'yes' and r['materialized'] == 'yes' for r in rows
              ),
              'partitions': dict(sorted(parts.items())),
              'extensions': dict(sorted(extensions.items())),
              'census_method': 'git ls-tree path/object census without blob-size resolution',
          }
          (root / 'CORPUS_SUMMARY.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f "$evidence/tree.z"

          cat > .graphifyignore <<'EOF'
          .git/
          **/node_modules/
          **/dist/
          **/build/
          **/coverage/
          **/.turbo/
          **/.cache/
          EOF

      - name: Install checksum-verified Graphify
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/eliza-evidence"
          status=0
          python3 -m venv "$RUNNER_TEMP/graphify-venv" || status=$?
          if [ "$status" -eq 0 ]; then
            source "$RUNNER_TEMP/graphify-venv/bin/activate"
            python -m pip install --upgrade pip > "$evidence/logs/pip-upgrade.log" 2>&1 || status=$?
            mkdir -p "$RUNNER_TEMP/wheel"
            python -m pip download --no-deps --only-binary=:all: "graphifyy==$GRAPHIFY_VERSION" -d "$RUNNER_TEMP/wheel" > "$evidence/logs/wheel-download.log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            wheel="$(find "$RUNNER_TEMP/wheel" -name 'graphifyy-*.whl' -print -quit)"
            test -n "$wheel" || status=1
          fi
          if [ "$status" -eq 0 ]; then
            printf '%s  %s\n' "$GRAPHIFY_WHEEL_SHA256" "$wheel" | sha256sum -c - > "$evidence/logs/wheel-sha256.log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cp "$wheel" "$evidence/"
            python -m pip install "$wheel" > "$evidence/logs/graphify-install.log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            graphify --version | tee "$evidence/logs/graphify-version.log" || status=$?
            python -m pip freeze | sort > "$evidence/logs/python-environment.freeze.txt"
          fi
          printf '{"exit_code":%s}\n' "$status" > "$evidence/graphify-install-status.json"
          exit "$status"

      - name: Native Graphify pass 1
        id: pass1
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/eliza-evidence"
          status=0
          source "$RUNNER_TEMP/graphify-venv/bin/activate" 2>/dev/null || status=125
          if [ "$status" -eq 0 ]; then
            rm -rf graphify-out graph.json
            graphify extract . --code-only --force --timing --max-workers 1 > "$evidence/logs/pass1-extract.log" 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              graphify cluster-only . --no-label --timing > "$evidence/logs/pass1-cluster.log" 2>&1 || status=$?
            fi
            if [ "$status" -eq 0 ] && [ -s graphify-out/graph.json ]; then
              cp -a graphify-out "$evidence/native/run-1"
            elif [ "$status" -eq 0 ]; then
              status=126
            fi
          fi
          printf '{"exit_code":%s}\n' "$status" > "$evidence/pass1-status.json"
          exit "$status"

      - name: Native Graphify pass 2
        id: pass2
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/eliza-evidence"
          status=0
          source "$RUNNER_TEMP/graphify-venv/bin/activate" 2>/dev/null || status=125
          if [ "$status" -eq 0 ]; then
            rm -rf graphify-out graph.json
            graphify extract . --code-only --force --timing --max-workers 1 > "$evidence/logs/pass2-extract.log" 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              graphify cluster-only . --no-label --timing > "$evidence/logs/pass2-cluster.log" 2>&1 || status=$?
            fi
            if [ "$status" -eq 0 ] && [ -s graphify-out/graph.json ]; then
              cp -a graphify-out "$evidence/native/run-2"
            elif [ "$status" -eq 0 ]; then
              status=126
            fi
          fi
          printf '{"exit_code":%s}\n' "$status" > "$evidence/pass2-status.json"
          exit "$status"

      - name: Verify determinism, integrity, and query traversal
        id: review
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/eliza-evidence"
          export EVIDENCE_DIR="$evidence"
          status=0
          python3 - <<'PY' > "$evidence/logs/native-review.log" 2>&1 || status=$?
          import hashlib, json, os, subprocess
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_DIR'])
          volatile = {
              'generated_at', 'created_at', 'updated_at', 'timestamp', 'timing',
              'duration', 'duration_ms', 'elapsed', 'cost', 'run_id', 'built_at',
          }

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in sorted(value.items()) if k not in volatile}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          summaries, payloads, parsed = [], [], []
          for name in ('run-1', 'run-2'):
              path = root / 'native' / name / 'graph.json'
              if not path.exists():
                  summaries.append({'run': name, 'present': False})
                  payloads.append(None)
                  parsed.append(None)
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              nodes = data.get('nodes', [])
              edges = data.get('links', data.get('edges', []))
              if isinstance(nodes, dict):
                  nodes = list(nodes.values())
              if isinstance(edges, dict):
                  edges = list(edges.values())
              ids = [str(n.get('id')) for n in nodes]
              endpoints = set(ids)
              missing, loops, duplicate_count, seen = [], 0, 0, set()
              for edge in edges:
                  source = edge.get('source')
                  target = edge.get('target')
                  source = source.get('id') if isinstance(source, dict) else source
                  target = target.get('id') if isinstance(target, dict) else target
                  source, target = str(source), str(target)
                  relation = str(edge.get('relation', edge.get('type', 'unknown')))
                  if source not in endpoints or target not in endpoints:
                      missing.append([source, target, relation])
                  if source == target:
                      loops += 1
                  signature = (source, target, relation)
                  duplicate_count += int(signature in seen)
                  seen.add(signature)
              canonical = json.dumps({
                  'nodes': sorted(json.dumps(scrub(n), sort_keys=True, separators=(',', ':'), ensure_ascii=False) for n in nodes),
                  'edges': sorted(json.dumps(scrub(e), sort_keys=True, separators=(',', ':'), ensure_ascii=False) for e in edges),
              }, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
              payloads.append(canonical)
              parsed.append((data, nodes, edges))
              summaries.append({
                  'run': name,
                  'present': True,
                  'graph_json_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'canonical_structure_sha256': hashlib.sha256(canonical).hexdigest(),
                  'node_count': len(nodes),
                  'edge_count': len(edges),
                  'unique_node_ids': len(ids) == len(set(ids)),
                  'missing_endpoint_count': len(missing),
                  'self_loops': loops,
                  'duplicate_edge_signatures': duplicate_count,
                  'node_types': dict(sorted(Counter(str(n.get('type', n.get('kind', 'unknown'))) for n in nodes).items())),
                  'edge_relations': dict(sorted(Counter(str(e.get('relation', e.get('type', 'unknown'))) for e in edges).items())),
              })

          result = {
              'runs': summaries,
              'both_present': all(item.get('present') for item in summaries),
              'exact_graph_json_match': len(summaries) == 2 and summaries[0].get('graph_json_sha256') == summaries[1].get('graph_json_sha256'),
              'canonical_structure_match': payloads[0] is not None and payloads[0] == payloads[1],
          }
          (root / 'NATIVE_DETERMINISM.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          if not result['both_present'] or not result['canonical_structure_match']:
              raise SystemExit('missing or structurally non-deterministic native graph')
          if not all(
              item['unique_node_ids'] and not item['missing_endpoint_count'] and
              not item['self_loops'] and not item['duplicate_edge_signatures']
              for item in summaries
          ):
              raise SystemExit('native graph integrity failure')

          graphify = Path(os.environ['RUNNER_TEMP']) / 'graphify-venv' / 'bin' / 'graphify'
          graph = root / 'native' / 'run-2' / 'graph.json'
          questions = [
              'AgentRuntime',
              'IAgentRuntime',
              'registerPlugin',
              'composeState',
              'Memory',
              'Service',
              'Task',
              'Event',
              'ScenarioRunner',
              'Vault secret credential',
          ]
          query_results = []
          for index, question in enumerate(questions, 1):
              proc = subprocess.run(
                  [str(graphify), 'query', question, '--graph', str(graph)],
                  text=True, capture_output=True, check=False,
              )
              query_results.append({
                  'id': f'Q{index:02d}', 'question': question,
                  'returncode': proc.returncode,
                  'stdout_bytes': len(proc.stdout.encode()),
                  'stderr_bytes': len(proc.stderr.encode()),
              })
              (root / 'queries' / f'Q{index:02d}.txt').write_text(
                  f'QUESTION\n{question}\n\nRETURN CODE\n{proc.returncode}\n\nSTDOUT\n{proc.stdout}\n\nSTDERR\n{proc.stderr}\n',
                  encoding='utf-8',
              )
          (root / 'NATIVE_QUERY_RESULTS.json').write_text(json.dumps(query_results, indent=2) + '\n', encoding='utf-8')
          if any(item['returncode'] != 0 for item in query_results):
              raise SystemExit('one or more graph query commands failed')
          PY
          printf '{"exit_code":%s}\n' "$status" > "$evidence/native-review-status.json"
          exit "$status"

      - name: Record essential package qualification boundary
        id: qualification
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/eliza-evidence"
          export EVIDENCE_DIR="$evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIR'])
          manifests = []
          for path in sorted(Path('packages').glob('*/package.json')):
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  manifests.append({
                      'path': path.as_posix(),
                      'name': payload.get('name'),
                      'version': payload.get('version'),
                      'scripts': sorted((payload.get('scripts') or {}).keys()),
                  })
              except Exception as exc:
                  manifests.append({'path': path.as_posix(), 'error': str(exc)})
          result = {
              'package_manifests_parsed': manifests,
              'fresh_dependency_install': 'NOT_RUN_SPARSE_GRAPHIFICATION_WORKSPACE',
              'fresh_typecheck': 'NOT_RUN',
              'fresh_tests': 'NOT_RUN',
              'fresh_build': 'NOT_RUN',
              'reason': 'Graphification run intentionally materializes the essential framework only; full monorepo qualification requires a separate complete checkout.',
          }
          (root / 'qualification' / 'PROJECT_QUALIFICATION.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Finalize evidence manifest and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/eliza-evidence"
          mkdir -p "$evidence/logs"
          export EVIDENCE_DIR="$evidence"
          export EVENT_SHA="$GITHUB_SHA"
          export EVENT_REF="$GITHUB_REF"
          export REPOSITORY="$GITHUB_REPOSITORY"
          export RUN_ID="$GITHUB_RUN_ID"
          export RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          export INSTALL_OUTCOME="${{ steps.install.outcome }}"
          export PASS1_OUTCOME="${{ steps.pass1.outcome }}"
          export PASS2_OUTCOME="${{ steps.pass2.outcome }}"
          export REVIEW_OUTCOME="${{ steps.review.outcome }}"
          export QUALIFICATION_OUTCOME="${{ steps.qualification.outcome }}"
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_DIR'])

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              if path.name in {'ARTIFACT_HASHES.sha256', 'NATIVE_RUN_MANIFEST.json'}:
                  continue
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'bytes': path.stat().st_size,
                  'sha256': digest(path),
              })
          manifest = {
              'schema_version': '1.0',
              'repository': os.environ['REPOSITORY'],
              'frozen_source_sha': os.environ['SOURCE_SHA'],
              'frozen_source_tree': os.environ['SOURCE_TREE'],
              'workflow_event_sha': os.environ['EVENT_SHA'],
              'workflow_ref': os.environ['EVENT_REF'],
              'workflow_run_id': os.environ['RUN_ID'],
              'workflow_run_attempt': os.environ['RUN_ATTEMPT'],
              'graphify_package': 'graphifyy',
              'graphify_version': os.environ['GRAPHIFY_VERSION'],
              'graphify_wheel_sha256': os.environ['GRAPHIFY_WHEEL_SHA256'],
              'execution_mode': 'native Graphify CLI; essential framework sparse checkout; complete path census; two clean code-only passes; no LLM labels',
              'query_logging_disabled': os.environ.get('GRAPHIFY_QUERY_LOG_DISABLE') == '1',
              'python': platform.python_version(),
              'platform': platform.platform(),
              'step_outcomes': {
                  'graphify_install': os.environ['INSTALL_OUTCOME'],
                  'graphify_pass_1': os.environ['PASS1_OUTCOME'],
                  'graphify_pass_2': os.environ['PASS2_OUTCOME'],
                  'graph_review': os.environ['REVIEW_OUTCOME'],
                  'qualification_boundary': os.environ['QUALIFICATION_OUTCOME'],
              },
              'files': files,
          }
          manifest_path = root / 'NATIVE_RUN_MANIFEST.json'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          with (root / 'ARTIFACT_HASHES.sha256').open('w', encoding='utf-8') as stream:
              for item in files:
                  stream.write(f"{item['sha256']}  {item['path']}\n")
              stream.write(f"{digest(manifest_path)}  NATIVE_RUN_MANIFEST.json\n")
          PY
          find "$evidence" -maxdepth 5 -type f -printf '%P\t%s bytes\n' | sort | tee "$evidence/logs/artifact-list.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eliza-essential-graphify-8d60e536-fast2
          path: ${{ runner.temp }}/eliza-evidence/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 6
          overwrite: false
